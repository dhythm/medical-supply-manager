name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [db:validate, format:check, lint, knip, typecheck, test, build]
    env:
      DATABASE_URL: postgresql://medibase:medibase_dev@127.0.0.1:55432/medical_supply_manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}
  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_DB: medical_supply_manager_test
          POSTGRES_USER: medibase
          POSTGRES_PASSWORD: medibase_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U medibase -d medical_supply_manager_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://medibase:medibase_ci@127.0.0.1:5432/medical_supply_manager_test
      TEST_DATABASE_URL: postgresql://medibase:medibase_ci@127.0.0.1:5432/medical_supply_manager_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test:prepare
      - run: pnpm test:integration
